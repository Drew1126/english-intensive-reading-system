<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外刊阅读</title>
    <link rel="stylesheet" href="css/main.css?v=3">
    <link rel="stylesheet" href="css/article.css?v=4">
    <link rel="stylesheet" href="css/panel.css?v=2">
</head>
<body>
    <!-- Login overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-modal">
            <h2>登录</h2>
            <div class="login-form">
                <input type="text" id="loginUsername" placeholder="用户名" autocomplete="off">
                <input type="password" id="loginPassword" placeholder="密码">
                <div class="login-error" id="loginError"></div>
                <button id="loginBtn">登录</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <section class="article-section">
            <header class="header">
                <div class="header-left">
                    <span class="today-date" id="todayDate"></span>
                </div>
                <div class="header-right">
                    <div class="user-info" id="userInfo" style="display:none">
                        <img class="user-avatar" id="userAvatar" src="default-avatar.svg" alt="avatar">
                        <span class="user-name" id="userName"></span>
                        <button class="btn-logout" id="logoutBtn">退出</button>
                    </div>
                    <div class="user-info not-logged-in" id="notLoggedIn">
                        <button class="btn-login" id="loginBtnHeader">登录</button>
                    </div>
                    <nav class="article-nav-bar">
                        <button class="btn-history" id="btnHistory" title="历史文章">&#x1F4C2;</button>
                        <button class="btn-upload-pdf" id="btnUploadPdf">上传 PDF</button>
                        <input type="file" id="pdfFileInput" accept=".pdf" style="display:none">
                    </nav>
                </div>
            </header>

            <div class="article-content">
                <div class="article-header">
                    <span class="source-tag" id="sourceTag"></span>
                    <span class="word-count-tag" id="wordCountTag"></span>
                    <button class="btn-edit-article" id="btnEditArticle" style="display:none">编辑</button>
                </div>
                <h2 class="article-title" id="articleTitle"></h2>
                <div class="article-body" id="articleBody">
                    <div class="loading" id="articleLoading">加载中...</div>
                </div>
                <div class="checkin-area" id="checkinArea" style="display:none">
                    <div class="checkin-label">已打卡</div>
                    <div class="checkin-users" id="checkinUsers"></div>
                    <button class="btn-checkin" id="btnCheckin">打卡</button>
                </div>
            </div>
        </section>

        <aside class="agent-panel">
            <div class="selected-sentence" id="selectedSentence">
                <p class="placeholder">点击文章中的句子开始提问</p>
            </div>
            <div class="translation-toggle-row">
                <label class="toggle-switch">
                    <input type="checkbox" id="sentenceTranslationToggle">
                    <span class="slider"></span>
                    <span class="label-text">显示翻译</span>
                </label>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="quick-questions">
                <button class="quick-btn" data-question="解释选中内容在句子释义">句中释义</button>
                <button class="quick-btn" data-nofocus="1" data-question="请用括号标注法分析这个句子的句子结构，逐层划分并说明各成分">句子结构</button>
                <button class="quick-btn" data-question="请列出与选中内容相似的单词并辨析">相似词</button>
            </div>
            <div class="input-area">
                <input type="text" id="questionInput" placeholder="输入你的问题..." autocomplete="off">
                <button class="btn-send" id="btnSend">发送</button>
            </div>
        </aside>
    </main>

    <div class="history-overlay" id="historyOverlay">
        <div class="history-panel">
            <div class="history-header">
                <h3>历史文章</h3>
                <button class="history-close" id="historyClose">&times;</button>
            </div>
            <div class="history-tabs">
                <button class="history-tab active" data-tab="waikan" id="tabWaikanBtn">外刊</button>
                <button class="history-tab" data-tab="zhenti" id="tabZhentiBtn">考研真题</button>
            </div>
            <div class="history-body">
                <div class="history-tab-content" id="tabWaikanContent">
                    <div class="history-list" id="historyList"></div>
                </div>
                <div class="history-tab-content" id="tabZhentiContent" style="display:none">
                    <div class="zhenti-year-list" id="zhentiYearList"></div>
                    <div class="zhenti-text-view" id="zhentiTextView" style="display:none">
                        <button class="zhenti-back" id="zhentiBack">&larr; 返回年份</button>
                        <div class="zhenti-year-title" id="zhentiYearTitle"></div>
                        <div class="zhenti-text-grid" id="zhentiTextGrid"></div>
                        <div class="zhenti-upload-area" id="zhentiUploadArea" style="display:none">
                            <div class="zhenti-upload-title" id="zhentiUploadTitle"></div>
                            <div class="zhenti-paste-zone" id="zhentiPasteZone">
                                <p>点击选择文件，或将图片复制后 <b>Ctrl+V</b> 粘贴到这里</p>
                            </div>
                            <input type="file" id="zhentiFileInput" accept=".pdf,.png,.jpg,.jpeg,.gif,.bmp,.webp" multiple style="display:none">
                            <div class="zhenti-upload-hint">支持 PDF，或图片（可多张连续选择 / 连续粘贴）</div>
                            <div class="zhenti-file-list" id="zhentiFileList"></div>
                            <div class="zhenti-upload-actions">
                                <button id="zhentiUploadBtn">上传</button>
                                <button class="zhenti-cancel" id="zhentiUploadCancel">取消</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="avatar-overlay" id="avatarOverlay" style="display:none">
        <div class="avatar-modal">
            <h3>更换头像</h3>
            <input type="file" id="avatarFileInput" accept="image/*">
            <button id="avatarUploadBtn">上传</button>
            <button class="avatar-cancel" id="avatarCancelBtn">取消</button>
        </div>
    </div>

    <div class="edit-confirm-overlay" id="editConfirmOverlay" style="display:none">
        <div class="edit-confirm-modal">
            <p>是否更新翻译？</p>
            <div class="edit-confirm-actions">
                <button id="editConfirmYes">是</button>
                <button id="editConfirmNo">否</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/article.js"></script>
    <script src="js/zhenti.js"></script>
    <script src="js/agent.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
